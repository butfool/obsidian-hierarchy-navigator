<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hierarchy Navigator — Notion 风格方案</title>
<style>
  :root {
    --hn-text: #37352F;
    --hn-muted: #9B9A97;
    --hn-border: rgba(55, 53, 47, 0.12);
    --hn-hover: rgba(55, 53, 47, 0.08);
    --hn-chip: #F1F1EF;
    --hn-blue: #2383E2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 30px 40px 48px;
    background: #fff;
    color: var(--hn-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--hn-muted); font-size: 13px; margin-bottom: 26px; }
  section { margin-bottom: 38px; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--hn-muted); margin-bottom: 12px; }
  .demo { max-width: 1080px; }

  /* ── base block styles (mirror of the plugin, light theme) ─────── */
  .hn-root { font-size: 14px; color: var(--hn-text); }
  .hn-rail {
    display: flex; align-items: center; justify-content: space-between;
    height: 26px; padding: 0 2px; margin: 0 0 6px;
    border-bottom: 1px dashed var(--hn-border);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--hn-muted);
  }
  .hn-rail-left, .hn-rail-right { display: flex; align-items: center; gap: 6px; }
  .hn-rail svg { width: 13px; height: 13px; flex: 0 0 13px; opacity: .7; }
  .hn-rail-meta { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11.5px; }
  .hn-segments {
    display: grid; grid-template-columns: max-content 1fr;
    column-gap: 10px; row-gap: 6px; align-items: center;
  }
  .hn-segment { display: contents; }
  .hn-segment-head {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--hn-muted); white-space: nowrap;
  }
  .hn-segment-head svg { width: 13px; height: 13px; flex: 0 0 13px; opacity: .65; }
  .hn-segment-body { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .hn-pills { display: flex; align-items: center; flex-wrap: nowrap; gap: 4px; min-width: 0; }
  .hn-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border: 1px solid var(--hn-border); border-radius: 999px;
    font-size: 13px; line-height: 1; color: var(--hn-text); text-decoration: none;
    white-space: nowrap; cursor: pointer; transition: background 120ms, border-color 120ms;
  }
  .hn-pill:hover { background: var(--hn-hover); }
  .hn-pill svg { width: 12px; height: 12px; flex: 0 0 12px; opacity: .7; color: var(--hn-muted); }
  .hn-pill.hn-kind-folder-note svg, .hn-pill.hn-kind-home svg { color: var(--hn-blue); opacity: .9; }
  .hn-pill.hn-current { border-color: var(--hn-blue); }
  .hn-more { position: relative; }
  .hn-more summary { list-style: none; }
  .hn-more summary::-webkit-details-marker { display: none; }
  .hn-more-chip {
    display: inline-flex; align-items: center; padding: 3px 8px;
    border: 1px dashed var(--hn-border); border-radius: 999px;
    color: var(--hn-muted); font-size: 12.5px; line-height: 1; cursor: pointer;
  }

  /* ── A · 现状（对照） ─────────────────────────────────────────── */
  /* uses the base styles above unchanged */

  /* ── B · Notion 行内链接（无胶囊、无边框，hover 出浅灰底） ───── */
  .v-b .hn-rail { border-bottom: none; height: 22px; padding: 0 2px; margin-bottom: 4px; }
  .v-b .hn-rail-label, .v-b .hn-rail-meta { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
  .v-b .hn-segments { row-gap: 2px; column-gap: 8px; }
  .v-b .hn-segment-head { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
  .v-b .hn-pill { border: none; border-radius: 4px; padding: 3px 6px; gap: 6px; font-size: 13.5px; }
  .v-b .hn-pill:hover { background: var(--hn-hover); }
  .v-b .hn-pill svg { width: 16px; height: 16px; flex: 0 0 16px; opacity: .5; }
  .v-b .hn-pill.hn-current { background: rgba(35, 131, 226, 0.10); color: var(--hn-blue); font-weight: 500; }
  .v-b .hn-current svg { color: currentColor; }
  .v-b .hn-more-chip { border: none; background: rgba(55, 53, 47, 0.06); border-radius: 4px; padding: 3px 6px; color: #787774; font-size: 12.5px; }

  /* ── C · Notion 属性行（左标签列 + 右值，像下面的 Properties） ── */
  .v-c .hn-rail { display: none; }
  .v-c .hn-segments { grid-template-columns: 96px 1fr; row-gap: 1px; column-gap: 6px; }
  .v-c .hn-segment-head { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; padding: 5px 0; }
  .v-c .hn-pill { border: none; border-radius: 3px; padding: 4px 6px; font-size: 13.5px; gap: 6px; }
  .v-c .hn-pill:hover { background: var(--hn-hover); }
  .v-c .hn-pill svg { width: 15px; height: 15px; flex: 0 0 15px; opacity: .55; }
  .v-c .hn-pill.hn-current { background: rgba(35, 131, 226, 0.10); color: var(--hn-blue); }
  .v-c .hn-more-chip { border: none; border-radius: 3px; background: rgba(55, 53, 47, 0.06); padding: 4px 6px; color: #787774; }

  /* ── D · Notion 软胶囊（保留 chip，但去边框、方一点） ─────────── */
  .v-d .hn-rail { border-bottom: none; height: 22px; padding: 0 2px; margin-bottom: 6px; }
  .v-d .hn-rail-label, .v-d .hn-rail-meta { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
  .v-d .hn-segment-head { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
  .v-d .hn-segments { row-gap: 4px; }
  .v-d .hn-pill { border: none; border-radius: 6px; background: var(--hn-chip); padding: 3px 8px; font-size: 13px; }
  .v-d .hn-pill:hover { background: #E9E9E7; }
  .v-d .hn-pill svg { width: 15px; height: 15px; flex: 0 0 15px; }
  .v-d .hn-pill.hn-current { background: rgba(35, 131, 226, 0.12); color: var(--hn-blue); font-weight: 500; }
  .v-d .hn-current svg { color: currentColor; }
  .v-d .hn-more-chip { border: none; border-radius: 6px; background: var(--hn-chip); padding: 3px 8px; color: #787774; }
</style>
</head>
<body>
  <h1>Hierarchy Navigator — Notion 风格方案</h1>
  <div class="sub">同一份内容（Parent / Siblings / Children，含 “+4” 折叠与 Homepage 图标）在四种风格下的样子。点击任意条目可看到 hover 效果。</div>

  <section data-v="a"><div class="label">A · 现状（对照）</div><div class="demo v-a"></div></section>
  <section data-v="b"><div class="label">B · Notion 行内链接：无边框无胶囊，hover 浅灰底</div><div class="demo v-b"></div></section>
  <section data-v="c"><div class="label">C · Notion 属性行：左标签 + 右内容，与下方 Properties 同构</div><div class="demo v-c"></div></section>
  <section data-v="d"><div class="label">D · Notion 软胶囊：保留 chip，去边框、圆角收方、浅灰底</div><div class="demo v-d"></div></section>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const icon = (paths) =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
  const I = {
    folder: icon('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
    note: icon('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 11h6M9 14h4"/>'),
    home: icon('<path d="M3 10.7 12 3.6l9 7.1"/><path d="M5.5 9.7V19a1.5 1.5 0 0 0 1.5 1.5h10A1.5 1.5 0 0 0 18.5 19V9.7"/><path d="M9.5 20.5v-4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v4.8"/>'),
    up: icon('<path d="M6 15l6-6 6 6"/>'),
    down: icon('<path d="M6 9l6 6 6-6"/>'),
    hash: icon('<path d="M4 9h16M4 15h16M10 4l-2 16M16 4l-2 16"/>'),
    compass: icon('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2.4 4.8-4.8 2.4 2.4-4.8z"/>')
  };
  const pill = (kind, name, current) =>
    `<a class="hn-pill hn-kind-${kind}${current ? ' hn-current' : ''}">` +
      (kind === 'home' ? I.home : kind === 'folder-note' ? I.note : I.folder) +
      `<span class="hn-pill-name">${name}</span></a>`;

  const block =
    `<div class="hn-root">
      <div class="hn-rail">
        <div class="hn-rail-left">${I.compass}<span class="hn-rail-label">Hierarchy</span></div>
        <div class="hn-rail-right"><span class="hn-rail-meta">direct only</span></div>
      </div>
      <div class="hn-segments">
        <div class="hn-segment">
          <div class="hn-segment-head">${I.up}<span class="hn-segment-label">Parent</span></div>
          <div class="hn-segment-body"><div class="hn-pills">${pill('home', 'Home')}</div></div>
        </div>
        <div class="hn-segment">
          <div class="hn-segment-head">${I.hash}<span class="hn-segment-label">Siblings</span></div>
          <div class="hn-segment-body">
            <div class="hn-pills">
              ${pill('folder-note', 'Home', true)}${pill('folder', 'Drafts')}${pill('folder', 'Inbox')}${pill('folder', 'References')}${pill('folder-note', 'Research')}${pill('folder-note', 'Meetings')}
            </div>
            <details class="hn-more"><summary class="hn-more-chip">+4</summary></details>
          </div>
        </div>
        <div class="hn-segment">
          <div class="hn-segment-head">${I.down}<span class="hn-segment-label">Children</span></div>
          <div class="hn-segment-body"><div class="hn-pills">${pill('folder', 'Base')}</div></div>
        </div>
      </div>
    </div>`;

  document.querySelectorAll('.demo').forEach((el) => { el.innerHTML = block; });

  // ?#v=b → render only variant b (used for screenshots)
  const m = /v=([a-d])/.exec(location.hash);
  if (m) {
    const keep = m[1];
    document.querySelectorAll('section').forEach((s) => { if (s.dataset.v !== keep) s.remove(); });
    document.querySelector('h1')?.remove();
    document.querySelector('.sub')?.remove();
    document.body.style.padding = '26px 34px';
  }
</script>
</body>
</html>
